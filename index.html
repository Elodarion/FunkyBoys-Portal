<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0e13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Funky Boys">
<title>Funky Boys Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: moderne dunkle App-Oberfläche. Schwebende Kopfleiste, links die Rubriken, rechts große weiche Karten.
     Die Akzentfarben hängen am Motto der Session (data-motto am html-Element). */
  :root {
    --paper:#0c0e13; --card:#141821; --soft:#1b2130; --field:#0f1219; --line:#272e3f; --ink:#eef1f7; --muted:#a6b0c5; --faint:#8490a8;
    --good:#4fd896; --good-bg:rgba(79,216,150,.14); --warn:#f6b94a; --warn-bg:rgba(246,185,74,.15); --bad:#ff7a7a; --bad-bg:rgba(255,122,122,.15);
    --display:'Outfit', 'Inter', system-ui, sans-serif; --mark:'Outfit', 'Inter', system-ui, sans-serif;
    --ui:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --bar:rgba(12,14,19,.78); --bar-ink:#eef1f7; --orn:""; --bar-tex:none;
    --accent:#f4a95a; --accent-bg:rgba(244,169,90,.14); --hi:#f0a04b; --hi2:#e2603a; --hi-ink:#1a1006; --prime:#f0a04b;
    --glow:rgba(240,160,75,.16); --glow2:rgba(226,96,58,.10);
    color-scheme:dark;
  }
  :root[data-motto="rotweiss"] { --accent:#ff7482; --accent-bg:rgba(255,77,94,.15); --hi:#e03144; --hi2:#a8182b; --hi-ink:#ffffff; --prime:#e03144; --glow:rgba(224,49,68,.18); --glow2:rgba(255,255,255,.04); }
  :root[data-motto="schlicht"] { --accent:#78b4ff; --accent-bg:rgba(90,150,255,.15); --hi:#3573e6; --hi2:#2149a8; --hi-ink:#ffffff; --prime:#3573e6; --glow:rgba(70,130,255,.18); --glow2:rgba(120,180,255,.06); }
  :root[data-motto="planer"] { --accent:#bb94ff; --accent-bg:rgba(160,110,255,.16); --hi:#7e4fe0; --hi2:#4f2a9e; --hi-ink:#ffffff; --prime:#7e4fe0; --glow:rgba(140,90,240,.20); --glow2:rgba(245,196,81,.07); }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background-color:var(--paper); background-image:radial-gradient(60rem 28rem at 88% -8%, var(--glow), transparent 62%), radial-gradient(44rem 26rem at -8% 6%, var(--glow2), transparent 60%); background-attachment:fixed; color:var(--ink); font-family:var(--ui); font-size:15px; line-height:1.5; }
  a { color:var(--accent); }
  ::selection { background:var(--hi); color:var(--hi-ink); }
  h1,h2,h3 { font-family:var(--display); text-wrap:balance; margin:0; color:var(--ink); font-weight:600; letter-spacing:-.01em; }
  h2 { font-size:30px; line-height:1.15; } h3 { font-size:18px; }
  button, input, select, textarea { font-family:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  [hidden] { display:none !important; }

  .top { position:sticky; top:0; z-index:30; background:var(--bar); -webkit-backdrop-filter:blur(14px) saturate(1.4); backdrop-filter:blur(14px) saturate(1.4); color:var(--bar-ink); padding:10px 20px; border-bottom:1px solid var(--line); }
  .top-in { max-width:1240px; margin:0 auto; display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:12px; color:inherit; text-decoration:none; min-width:0; }
  .badge { flex:0 0 44px; height:44px; border-radius:14px; background:linear-gradient(135deg,var(--hi),var(--hi2)); color:var(--hi-ink); display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700; font-size:16px; box-shadow:0 6px 20px -6px var(--hi); }
  .badge svg { width:24px; height:24px; fill:currentColor; }
  .brand b { display:block; font-family:var(--mark); font-size:22px; font-weight:700; line-height:1.15; letter-spacing:-.01em; }
  .brand small { display:block; font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--accent); font-weight:600; overflow-wrap:anywhere; }
  .who { display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--muted); }
  .who select { min-height:40px; border-radius:12px; border:1px solid var(--line); background:var(--soft); color:var(--ink); padding:6px 10px; font-size:14px; max-width:100%; }
  .note { color:var(--faint); font-size:12px; padding:8px 20px 0; }
  .note div { max-width:1240px; margin:0 auto; }

  .shell { max-width:1240px; margin:0 auto; padding:20px 20px 56px; display:grid; grid-template-columns:232px minmax(0,1fr); gap:28px; align-items:start; }
  nav { display:flex; flex-direction:column; gap:2px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:8px; position:sticky; top:78px; max-height:calc(100vh - 94px); overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  nav a { text-decoration:none; color:var(--muted); padding:9px 12px; border-radius:12px; font-weight:500; transition:background .15s, color .15s; }
  nav a:hover { background:var(--soft); color:var(--ink); }
  nav a.on { background:var(--accent-bg); color:var(--ink); font-weight:600; box-shadow:inset 3px 0 0 var(--accent); }
  nav .grp { font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--faint); padding:14px 12px 4px; font-weight:600; margin-top:4px; }
  nav .grp:first-child { margin-top:0; padding-top:6px; }
  nav a.par { color:var(--ink); font-weight:600; }
  nav a.sub { padding-left:26px; font-size:14px; }
  nav a.sub::before { content:"↳ "; opacity:.5; }
  main { display:flex; flex-direction:column; gap:18px; min-width:0; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; }
  .tabs a { text-decoration:none; color:var(--muted); font-weight:600; padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:var(--card); }
  .tabs a:hover { color:var(--ink); border-color:var(--faint); }
  .tabs a.on { color:var(--hi-ink); background:linear-gradient(135deg,var(--hi),var(--hi2)); border-color:transparent; }

  .head { display:flex; flex-wrap:wrap; gap:8px 10px; align-items:flex-end; justify-content:space-between; padding:2px 0 6px; }
  .head h2 { flex:1 1 auto; }
  .head .crumb { flex-basis:100%; font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--accent); font-weight:600; }
  .head p { margin:0; color:var(--muted); font-size:14px; flex-basis:100%; max-width:65ch; }
  .hero { position:relative; overflow:hidden; background:linear-gradient(135deg,var(--hi) 0%,var(--hi2) 100%); color:var(--hi-ink); border-radius:24px; padding:26px 28px; display:flex; flex-direction:column; gap:6px; box-shadow:0 18px 50px -22px var(--hi); }
  .hero::before, .hero::after { content:""; position:absolute; border-radius:50%; background:rgba(255,255,255,.12); pointer-events:none; }
  .hero::before { width:260px; height:260px; right:-70px; top:-110px; } .hero::after { width:150px; height:150px; right:90px; bottom:-90px; background:rgba(255,255,255,.08); }
  .hero small { font-size:11px; letter-spacing:1.8px; text-transform:uppercase; font-weight:700; opacity:.78; }
  .hero b { font-family:var(--mark); font-weight:700; font-size:36px; line-height:1.1; letter-spacing:-.02em; overflow-wrap:anywhere; position:relative; }
  .hero span { font-size:16px; opacity:.92; position:relative; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; display:flex; flex-direction:column; gap:12px; min-width:0; box-shadow:inset 0 1px 0 rgba(255,255,255,.03); }
  .panel > .ph { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; padding-bottom:10px; border-bottom:1px solid var(--line); }
  .panel > .ph h3::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:linear-gradient(135deg,var(--hi),var(--hi2)); margin-right:10px; vertical-align:middle; position:relative; top:-1px; }
  .cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:18px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
  .kpi { background:linear-gradient(180deg,var(--soft),var(--card)); border:1px solid var(--line); border-radius:18px; padding:14px 16px; }
  .kpi small { display:block; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--faint); font-weight:600; }
  .kpi b { display:block; font-family:var(--display); font-size:28px; font-weight:600; letter-spacing:-.01em; font-variant-numeric:tabular-nums; color:var(--ink); overflow-wrap:anywhere; }
  .kpi span { font-size:13px; color:var(--muted); }

  .rows { display:flex; flex-direction:column; }
  .row { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; padding:11px 0; border-top:1px solid var(--line); }
  .row:first-child { border-top:none; padding-top:0; }
  .row .grow { flex:1 1 180px; min-width:0; overflow-wrap:anywhere; }
  .row .sub { font-size:13px; color:var(--muted); }
  .amt { font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; }
  .amt.in { color:var(--good); } .amt.out { color:var(--bad); }
  .pill { font-size:11px; font-weight:600; letter-spacing:.3px; padding:3px 10px; border-radius:999px; background:var(--soft); border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
details.zl { margin-top:4px; } details.zl summary { cursor:pointer; color:var(--muted); font-size:13px; }
  .rsearch { display:flex; gap:8px; align-items:center; margin-top:12px; }
  .rsearch input { flex:1; max-width:520px; padding:11px 14px; border-radius:12px; border:1px solid var(--line); background:var(--soft); color:inherit; font:inherit; min-height:44px; }
  #gq { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--soft); color:inherit; font:inherit; min-height:46px; }
  .rasterwrap { overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:14px; }
  table.raster { border-collapse:collapse; font-size:13px; width:max-content; min-width:100%; }
  table.raster th, table.raster td { border:1px solid var(--line); padding:0; text-align:center; white-space:nowrap; }
  table.raster thead th { padding:8px 6px; background:var(--card); }
  table.raster th.rn { position:sticky; left:0; background:var(--card); text-align:left; padding:8px 10px; z-index:1; min-width:104px; max-width:132px; white-space:normal; line-height:1.25; font-size:12px; box-shadow:2px 0 6px -2px rgba(0,0,0,.45); }
  table.raster thead th { min-width:76px; }
  .rasterwrap { overscroll-behavior-x:contain; touch-action:pan-x pan-y; }
  @media (max-width:640px) { .rasterwrap { margin:0 -12px; border-radius:0; border-left:0; border-right:0; } }
  table.raster td.rs { padding:8px 10px; font-weight:600; }
  .rc { all:unset; box-sizing:border-box; display:block; min-width:76px; padding:13px 10px; min-height:50px; font-size:14px; cursor:pointer; color:var(--muted); }
  .rc:hover { background:var(--soft); }
  .rc.part { background:var(--warn-bg); color:var(--warn); font-weight:600; }
  .rc.on { background:var(--good-bg); color:var(--good); font-weight:600; }
  .rc:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .pill.good { background:var(--good-bg); color:var(--good); border-color:transparent; } .pill.warn { background:var(--warn-bg); color:var(--warn); border-color:transparent; }
  .pill.bad { background:var(--bad-bg); color:var(--bad); border-color:transparent; } .pill.vio { background:var(--accent-bg); color:var(--accent); border-color:transparent; }
  .demo { font-size:10px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; padding:2px 7px; border-radius:999px; border:1px dashed var(--faint); color:var(--faint); white-space:nowrap; margin-left:6px; }
  .empty { color:var(--faint); padding:6px 0; }
  .row select.st { width:auto; min-height:34px; padding:4px 8px; font-size:14px; }

  .btn { min-height:40px; padding:8px 16px; border-radius:12px; border:1px solid var(--line); background:var(--soft); color:var(--ink); font-weight:600; font-size:14px; cursor:pointer; transition:border-color .15s, background .15s, transform .15s; }
  .btn:hover { border-color:var(--accent); }
  .btn.pri { background:linear-gradient(135deg,var(--hi),var(--hi2)); border-color:transparent; color:var(--hi-ink); box-shadow:0 8px 22px -12px var(--hi); }
  .btn.pri:hover { filter:brightness(1.08); }
  .btn.dark, .btn.on { background:var(--accent-bg); border-color:var(--accent); color:var(--ink); }
  .btn.sm { min-height:34px; padding:5px 12px; font-size:13px; border-radius:10px; }
  .btn.yes.on { background:var(--good-bg); border-color:var(--good); color:var(--good); } .btn.no.on { background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }
  .btn:disabled { opacity:.6; cursor:default; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  input[type=text], input[type=number], input[type=date], input[type=time], input[type=search], input[type=email], input[type=password], select, textarea {
    width:100%; border:1px solid var(--line); background:var(--field); border-radius:12px; padding:10px 12px; font-size:16px; color:var(--ink); min-height:44px; }
  input:focus, select:focus, textarea:focus { border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-bg); }
  ::placeholder { color:var(--faint); }
  label.f { display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:600; color:var(--muted); }
  .chk { display:flex; gap:8px; align-items:center; font-size:14px; color:var(--muted); cursor:pointer; }
  .chk input { width:20px; height:20px; accent-color:var(--hi); }

  .ev { display:flex; background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; border-left:5px solid var(--faint); transition:border-color .15s, transform .15s; }
  .ev:hover { border-color:var(--faint); }
  .ev.past { opacity:.55; }
  .ev .d { flex:0 0 78px; background:var(--soft); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px 4px; }
  .ev .d i { font-style:normal; font-size:11px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:.5px; }
  .ev .d b { font-family:var(--display); font-size:30px; font-weight:600; line-height:1.05; } .ev .d u { text-decoration:none; font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.5px; }
  .ev .b { flex:1; min-width:0; padding:14px 18px; display:flex; flex-direction:column; gap:8px; overflow-wrap:anywhere; }
  .ev .t { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .ev .t strong { font-family:var(--display); font-size:19px; font-weight:600; }
  .ev .m { display:flex; flex-wrap:wrap; gap:4px 18px; font-size:13px; color:var(--muted); }
  .ev .m span b { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--faint); margin-right:4px; font-weight:600; }
  .ev .n { font-size:13px; color:var(--muted); background:var(--soft); border-radius:12px; padding:8px 12px; }
  .sess { display:flex; align-items:center; gap:14px; margin-top:10px; }
  .sess span { font-family:var(--display); font-weight:600; font-size:13px; letter-spacing:1.4px; text-transform:uppercase; color:var(--hi-ink); background:linear-gradient(135deg,var(--hi),var(--hi2)); padding:6px 16px; border-radius:999px; }
  .sess::after { content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent); }
  .mon { font-family:var(--display); font-weight:600; font-size:16px; color:var(--accent); margin:4px 0 -6px 2px; }
  .list { display:flex; flex-direction:column; gap:12px; }
  .calgrid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .calhd { background:var(--soft); text-align:center; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--faint); padding:7px 0; }
  .calday { background:var(--card); min-height:78px; padding:4px 5px; display:flex; flex-direction:column; gap:3px; font-size:12px; }
  .calday.out { background:var(--field); color:var(--faint); } .calday.today { outline:2px solid var(--accent); outline-offset:-2px; }
  .calnum { font-weight:600; font-size:12px; }
  .calbig .calday { min-height:104px; } .calbig .calday:hover { background:var(--soft); } .calbig .calchip { padding:3px 6px; } .calmore { font-size:11px; font-weight:600; color:var(--accent); cursor:pointer; }
  .calchip { background:var(--accent-bg); color:var(--accent); border-radius:6px; padding:1px 6px; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .calchip .cs { display:none; }
  .calmonthlist { display:none; margin-top:14px; }
  @media (max-width:640px) {
    .calbig .calday { min-height:60px; padding:3px 2px; gap:2px; align-items:center; }
    .calbig .calnum { font-size:12px; }
    .calbig .calchip { align-self:stretch; font-size:10px; line-height:15px; height:15px; min-height:15px; padding:0 3px; border-radius:4px; letter-spacing:-.2px; text-align:left; }
    .calbig .calchip .cl { display:none; } .calbig .calchip .cs { display:inline; }
    .calbig .calmore { font-size:10px; }
    .calhd { font-size:10px; letter-spacing:0; }
    .calmonthlist { display:block; }
  }
  .caltab { border-collapse:collapse; width:100%; font-size:13px; min-width:560px; }
  .caltab th, .caltab td { border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
  .caltab thead th { background:var(--soft); font-size:12px; text-transform:uppercase; letter-spacing:.3px; color:var(--faint); }
  .caltab td.busy { background:var(--bad-bg); text-align:center; color:var(--bad); font-weight:600; }
  .bugbtn { position:fixed; left:16px; bottom:16px; z-index:40; width:48px; height:48px; border-radius:50%; border:1px solid var(--line); background:var(--soft); color:var(--accent); cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 28px rgba(0,0,0,.45); padding:0; transition:border-color .15s; }
  .bugbtn:hover { border-color:var(--accent); }
  .bugbtn svg, .bell svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .tools { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
  .bell { position:relative; min-width:44px; min-height:44px; border-radius:12px; border:1px solid var(--line); background:var(--soft); color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .bell:hover { border-color:var(--accent); }
  .bell b { position:absolute; top:-6px; right:-6px; min-width:20px; height:20px; border-radius:10px; background:linear-gradient(135deg,var(--hi),var(--hi2)); color:var(--hi-ink); font-size:11px; display:flex; align-items:center; justify-content:center; padding:0 5px; }
  .cnt { display:inline-block; margin-left:6px; min-width:18px; padding:0 6px; border-radius:9px; background:var(--hi); color:var(--hi-ink); font-size:11px; font-weight:700; text-align:center; }
  .upd { background:var(--warn-bg); color:var(--warn); border-bottom:1px solid var(--warn); padding:10px 20px; font-weight:600; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; justify-content:center; }
  ul.log { margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px; }

  .bar { height:10px; background:var(--soft); border-radius:999px; overflow:hidden; flex:1 1 100%; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--hi),var(--hi2)); border-radius:999px; }
  .bar i.over { background:var(--bad); }
  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { text-align:left; padding:9px 10px; border-top:1px solid var(--line); white-space:nowrap; }
  th { font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--faint); border-top:none; font-weight:600; }
  td.c, th.c { text-align:center; }

  .overlay { position:fixed; inset:0; background:rgba(4,6,10,.72); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); display:flex; align-items:flex-start; justify-content:center; padding:24px 12px; overflow-y:auto; z-index:50; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:24px; width:100%; max-width:520px; box-shadow:0 30px 80px rgba(0,0,0,.6); display:flex; flex-direction:column; gap:12px; position:relative; overflow:hidden; }
  .box::before { content:""; position:absolute; left:0; right:0; top:0; height:3px; background:linear-gradient(90deg,var(--hi),var(--hi2)); }
